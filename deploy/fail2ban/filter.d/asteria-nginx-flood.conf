# nginx erişim logunda kısa sürede çok sayıda 4xx (tarama / brute-force / flood).
# Not: 444 (ağ seviyesinde düşürülen saldırı araçları) da sayılır.
[Definition]
failregex = ^<HOST> -.*"(?:GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)[^"]*" (?:400|401|403|404|405|408|413|414|429|444) 
ignoreregex = ^<HOST> -.*"(?:GET|HEAD) /(?:_next/static|favicon\.ico|robots\.txt|sitemap[^ ]*\.xml|manifest\.json)
