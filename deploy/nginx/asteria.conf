# ════════════════════════════════════════════════════════════════════════════
# ASTERIA SCANS — nginx ön kapı (Vercel Edge/Firewall'un VPS karşılığı)
#
# Kurulum: /etc/nginx/conf.d/asteria.conf  (http{} bağlamında include edilir)
#   1) ALAN_ADIN.COM'u kendi alan adınla değiştir (www dahil).
#   2) /etc/nginx/asteria-proxy-secret.conf dosyasını oluştur (chmod 600, root):
#        proxy_set_header X-Asteria-Proxy "<.env'deki PROXY_SHARED_SECRET>";
#   3) TLS: certbot --nginx -d alanadin.com -d www.alanadin.com
#   4) nginx -t && systemctl reload nginx
#
# Uygulama YALNIZCA 127.0.0.1:3000'de dinler; internete açık tek kapı burasıdır.
# ════════════════════════════════════════════════════════════════════════════

# ── Hız / bağlantı bölgeleri (IP başına; IPv6 için /64'e indirgenir) ──────────
# Not: sıkıştırılmış ('::') yazımda ilk 4 grup tam görünmeyen IPv6 adresleri burada /64'e indirgenmez;
# uygulama katmanı (lib/security/ipUtil.js) her durumda doğru /64 hesabı yapar.
map $remote_addr $limit_key {
    ~^(?<v6net>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+): $v6net;   # IPv6 → ilk 64 bit
    default $remote_addr;
}
limit_req_zone  $limit_key zone=asteria_page:20m  rate=10r/s;
limit_req_zone  $limit_key zone=asteria_api:20m   rate=8r/s;
limit_req_zone  $limit_key zone=asteria_auth:10m  rate=6r/m;    # login/register
limit_req_zone  $limit_key zone=asteria_admin:10m rate=5r/s;
limit_req_zone  $limit_key zone=asteria_img:20m   rate=15r/s;
limit_conn_zone $limit_key zone=asteria_conn:20m;
limit_req_status  429;
limit_conn_status 429;

# ── Ağ seviyesinde bilinen saldırı araçlarını sessizce düşür (444 = bağlantıyı kes) ──
map $http_user_agent $asteria_bad_ua {
    default 0;
    ""                                   1;   # boş User-Agent
    ~*(sqlmap|nikto|nmap|masscan|acunetix|netsparker|nessus|wpscan|dirbuster|gobuster|havij|w3af|openvas|nuclei|zgrab|feroxbuster|burp|zaproxy|hydra|metasploit|arachni|skipfish|wapiti|whatweb|sqlninja|commix|xsstrike|dirb|patator|appscan|trivy) 1;
}
# Sadece izin verilen metodlar
map $request_method $asteria_bad_method {
    default 1;
    GET 0; HEAD 0; POST 0; PUT 0; PATCH 0; DELETE 0; OPTIONS 0;
}

# ── Mikro-cache: herkese açık katalog uçları (CDN yokken DB'yi korur) ───────────
proxy_cache_path /var/cache/nginx/asteria levels=1:2 keys_zone=asteria_cache:20m max_size=500m inactive=10m use_temp_path=off;

# WebSocket yok; upstream keepalive
upstream asteria_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ALAN_ADIN.COM www.ALAN_ADIN.COM;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Tanımsız Host'lara (IP ile erişim, sahte Host) cevap verme → bağlantıyı kes
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;      # nginx ≥ 1.19.4: sertifika bile göstermez
    return 444;
}

# ── Ana site ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ALAN_ADIN.COM www.ALAN_ADIN.COM;

    server_tokens off;

    # TLS — yalnızca modern protokoller
    ssl_certificate     /etc/letsencrypt/live/ALAN_ADIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ALAN_ADIN.COM/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;
    # (OCSP stapling bilerek yok: Let's Encrypt OCSP desteğini 2025'te kapattı.)

    # ── Slowloris / yavaş istek / bellek tüketme savunması ──────────────────────
    client_header_timeout  10s;
    client_body_timeout    15s;
    send_timeout           20s;
    keepalive_timeout      15s;
    keepalive_requests     200;
    reset_timedout_connection on;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;
    client_body_buffer_size     128k;
    client_max_body_size        1m;          # varsayılan; yükleme uçlarında aşağıda artırılır
    http2_max_concurrent_streams 64;         # HTTP/2 rapid-reset ve stream flood azaltma

    # Eşzamanlı bağlantı sınırı (IP başına)
    limit_conn asteria_conn 40;

    # ── Ağ seviyesi filtreler ────────────────────────────────────────────────────
    if ($asteria_bad_method) { return 405; }
    if ($asteria_bad_ua)     { return 444; }

    # Dotfile / yedek / kaynak dosyaları (ACME hariç)
    location ~ /\.(?!well-known/acme-challenge) { return 404; }
    location ~* \.(?:env|git|svn|bak|old|orig|swp|sql|log|ini|conf|cfg|yml|yaml|toml|php|asp|aspx|jsp|cgi|pl|sh)$ { return 404; }

    # Uygulama sırrı ve doğru istemci IP'si (ASLA istemciden gelen değerler kullanılmaz)
    include /etc/nginx/asteria-proxy-secret.conf;     # proxy_set_header X-Asteria-Proxy "..."
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;      # EZER (append etmez) → sahte XFF yok
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Dışarıdan sahtelenmesi tehlikeli iç başlıklar
    proxy_set_header X-Middleware-Subrequest "";
    proxy_set_header X-Middleware-Prefetch   "";
    proxy_set_header X-Invoke-Path           "";
    proxy_set_header X-Invoke-Query          "";
    proxy_set_header X-Original-URL          "";
    proxy_set_header X-Rewrite-URL           "";
    proxy_set_header Proxy                   "";   # httpoxy
    proxy_set_header Forwarded               "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;
    proxy_hide_header X-Powered-By;
    proxy_intercept_errors off;

    # ── Giriş / kayıt: çok sıkı ──────────────────────────────────────────────────
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=asteria_auth burst=4 nodelay;
        client_max_body_size 16k;
        proxy_pass http://asteria_app;
    }

    # ── Admin: sıkı + yükleme boyutu ─────────────────────────────────────────────
    # İsteğe bağlı: sadece kendi IP'n → allow 203.0.113.7; deny all;
    location ~ ^/(admin-panel|admin5|api/admin) {
        limit_req zone=asteria_admin burst=20 nodelay;
        client_max_body_size 64m;
        client_body_timeout 60s;
        proxy_request_buffering on;
        proxy_pass http://asteria_app;
    }

    # ── Kullanıcı yüklemeleri (avatar/kapak/yorum görseli) ───────────────────────
    location ~ ^/api/(auth/profile|comments|chat) {
        limit_req zone=asteria_api burst=20 nodelay;
        client_max_body_size 8m;
        proxy_pass http://asteria_app;
    }

    # ── Görsel proxy ve Next görsel optimizasyonu (CPU pahalı) ───────────────────
    location ^~ /_next/image {
        limit_req zone=asteria_img burst=30 nodelay;
        proxy_pass http://asteria_app;
    }
    location ^~ /api/img {
        limit_req zone=asteria_img burst=40 nodelay;
        proxy_pass http://asteria_app;
    }

    # ── Herkese açık katalog uçları: mikro-cache (çerezsiz GET) ──────────────────
    location ~ ^/api/(series(/top|/trending|/editor-pick|/latest-updates)?|chapters/latest|languages|announcements)$ {
        limit_req zone=asteria_api burst=20 nodelay;
        proxy_cache asteria_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;                       # aynı anda gelen N istek tek DB sorgusu olur
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_no_cache     $http_authorization $cookie_yomi_token;
        proxy_cache_bypass $http_authorization $cookie_yomi_token;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://asteria_app;
    }

    # ── Diğer API'ler ────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=asteria_api burst=25 nodelay;
        proxy_pass http://asteria_app;
    }

    # ── Statik varlıklar (Next derleme çıktısı; içeriği hash'li → sonsuz cache) ──
    location ^~ /_next/static/ {
        proxy_cache asteria_cache;
        proxy_cache_valid 200 365d;
        proxy_pass http://asteria_app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Sayfalar ─────────────────────────────────────────────────────────────────
    location / {
        limit_req zone=asteria_page burst=30 nodelay;
        proxy_pass http://asteria_app;
    }
}
